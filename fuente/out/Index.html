<title>El Otro Lado · Stock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: pantalla de inicio a sangre con el logo; dentro, barra de marca fija y una columna estrecha de trabajo. */
:root{
  --bg:#231E1F; --surface:#2E2829; --surface-2:#382F30; --line:#4A3F3F;
  --fg:#F3E9E1; --muted:#B5A397; --brand:#D6BCA8; --brand-ink:#2B2526;
  --warn:#E9875F; --warn-bg:#4A2C22; --ok:#9BC59D; --ok-bg:#25352A; --info:#C9B07A;
  --negro:#2B2526; --beige:#D6BCA8;
  --display:"Playfair Display", "Bodoni 72", Didot, Georgia, serif;
  --body:"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F6F0EB; --surface:#FFFFFF; --surface-2:#F0E6DE; --line:#E1D3C8;
    --fg:#2B2526; --muted:#7A675C; --brand:#2B2526; --brand-ink:#F3E9E1;
    --warn:#B9471E; --warn-bg:#FBE3D8; --ok:#2F7A3A; --ok-bg:#E2F1E1; --info:#8A6A2A; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F6F0EB; --surface:#FFFFFF; --surface-2:#F0E6DE; --line:#E1D3C8;
  --fg:#2B2526; --muted:#7A675C; --brand:#2B2526; --brand-ink:#F3E9E1;
  --warn:#B9471E; --warn-bg:#FBE3D8; --ok:#2F7A3A; --ok-bg:#E2F1E1; --info:#8A6A2A; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--negro)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Portada (entrar e inicio): siempre con los colores del logo ---------- */
.portada{min-height:100vh;min-height:100dvh;background:#231F20 var(--logo, none) center 12% / min(100vw, 560px) no-repeat;color:var(--beige);display:flex;flex-direction:column;justify-content:flex-end}
.portada .wrap{width:100%;padding-block:24px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;background:linear-gradient(to bottom, rgba(35,31,32,0) 0, rgba(35,31,32,.94) 60px, #231F20 100%)}
.portada .wrap{max-width:520px}
.portada.completa{background-size:min(76vw, 40vh, 560px);background-position:center 3%}
.saludo{font-family:var(--display);font-size:28px;font-weight:700;margin:0;color:var(--beige)}
.saludo small{display:block;font-family:var(--body);font-size:14px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;opacity:.75;margin-top:2px}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:0 18px;border-radius:14px;border:1px solid rgba(214,188,168,.45);background:rgba(43,37,38,.72);backdrop-filter:blur(6px);color:var(--beige);text-align:left}
.menu button b{font-family:var(--display);font-weight:900;font-size:21px;letter-spacing:.06em}
.menu button span{font-size:14px;opacity:.8;text-align:right}
.menu button.prin{background:var(--beige);color:var(--negro);border-color:var(--beige)}
.portada .salir{align-self:center;background:none;border:0;color:var(--beige);opacity:.7;text-decoration:underline;font-size:15px;padding:6px}
/* Pantalla de inicio: logo arriba, botones justo debajo y "Salir" al fondo */
.portada.inicio{justify-content:flex-start;background-image:none}
.portada.inicio .logo-top{flex:none;width:min(62vw, 32vh, 340px);aspect-ratio:1;margin:max(8px, env(safe-area-inset-top,0px)) auto 0;background:var(--logo, none) center / contain no-repeat}
.portada.inicio .wrap{flex:1;background:none;padding-top:4px}
.portada.inicio .salir{margin-top:auto}
.nombres{display:flex;flex-wrap:wrap;gap:8px}
.nombres button{border:1px solid rgba(214,188,168,.5);background:rgba(43,37,38,.75);color:var(--beige);border-radius:999px;padding:10px 18px;font-size:18px;font-weight:600}
.nombres button[aria-pressed="true"]{background:var(--beige);color:var(--negro)}
.puntos{display:flex;gap:14px;justify-content:center;margin:4px 0}
.puntos i{width:16px;height:16px;border-radius:50%;border:2px solid var(--beige)}
.puntos i.on{background:var(--beige)}
.puntos i:nth-child(n+5){margin-right:-30px}  /* el 5.º y 6.º no cuentan para centrar: los 4 primeros nunca se mueven */
.puntos i.hueco{visibility:hidden}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.teclado button{height:58px;border-radius:14px;border:1px solid rgba(214,188,168,.35);background:rgba(43,37,38,.8);color:var(--beige);font-size:24px;font-weight:600}
.teclado button.vacio{visibility:hidden}
.teclado button.tecla-ok{background:var(--beige);color:var(--negro);font-size:19px;font-weight:700;border-color:var(--beige)}
.teclado button.tecla-ok:disabled{opacity:.35}
.entrar-nombre{display:flex;flex-direction:column;gap:12px;margin:8px 0 4px}
.entrar-nombre input{height:56px;border-radius:14px;border:1px solid rgba(214,188,168,.45);background:rgba(43,37,38,.85);color:var(--beige);font-size:20px;padding:0 16px;font-family:inherit}
.entrar-nombre input::placeholder{color:rgba(214,188,168,.5)}
.entrar-ok{width:100%;margin-top:12px}
.entrar-ok,.entrar-nombre .btn{background:var(--beige);color:var(--negro);height:52px;font-size:17px}
.entrar-ok:disabled{opacity:.45}
.error{color:#F2A07E;text-align:center;min-height:20px;font-weight:600;margin:0}
@media (prefers-reduced-motion: no-preference){ .agita{animation:agita .35s} @keyframes agita{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}} }

/* ---------- Cabecera interior ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--negro);color:var(--beige);border-bottom:1px solid #4A3F3F}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:9px}
.volver{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--beige);padding:4px 6px 4px 0}
.volver img{width:38px;height:38px;border-radius:4px}
.volver svg{width:18px;height:18px}
.titulo{flex:1;min-width:0;font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quien{border:1px solid #6B5A55;background:transparent;color:var(--beige);border-radius:999px;padding:6px 12px;font-size:14px;max-width:36vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:12px;color:#B5A397;white-space:nowrap}

main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--display);font-weight:900;font-size:30px;line-height:1.05;margin:20px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px;font-size:15px}

/* Filtros */
.filtros{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.buscar{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:16px}
.fila-filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
select.sel{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;max-width:100%}

/* Grupos por proveedor */
.grupo{margin:18px 0 6px}
.grupo-cab{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);display:flex;align-items:baseline;gap:8px;padding:8px 0 6px;border-bottom:2px solid var(--brand)}
.grupo-cab h2{font-family:var(--display);font-size:20px;font-weight:700;margin:0;flex:1;min-width:0}
.grupo-cab span{color:var(--muted);font-size:13px;white-space:nowrap}

/* Fila de producto (almacén) */
.prod{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.prod .nom{font-weight:600;font-size:17px;min-width:0}
.prod .meta{grid-column:1;color:var(--muted);font-size:13px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.prod.cambiado .nom::after{content:" ●";color:var(--info);font-size:12px}
.paso{grid-row:1 / span 2;grid-column:2;display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.paso button{width:44px;height:44px;border:0;background:var(--surface-2);font-size:22px;font-weight:600}
.paso input{width:54px;height:44px;border:0;background:transparent;text-align:center;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.paso input::placeholder{color:var(--muted);font-weight:400}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;letter-spacing:.02em}
.pill.pedir{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.nada{border:1px dashed var(--line);color:var(--muted);font-weight:500}
.pill.pedido{background:var(--surface-2);color:var(--info)}
.mas{grid-column:1 / -1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:6px;font-size:14px;color:var(--muted)}
.mas input{width:70px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:16px;text-align:center}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}

/* Barra de acción inferior */
.arriba{position:fixed;left:max(10px,calc(50% - 424px));opacity:.92;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:16;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.arriba[hidden]{display:none}
.arriba svg{width:22px;height:22px}
.accion{position:fixed;left:0;right:0;bottom:0;z-index:15;pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.accion .wrap{display:flex;justify-content:center;padding-block:14px}
.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:700;font-size:17px;background:var(--brand);color:var(--brand-ink);pointer-events:auto;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.btn[disabled]{opacity:.5}
.btn.sec{background:var(--surface-2);color:var(--fg);box-shadow:none}
.btn.peq{padding:9px 14px;font-size:15px;box-shadow:none}
.btn.peligro{background:var(--warn-bg);color:var(--warn);box-shadow:none}
a.btn{text-decoration:none;display:inline-block}

/* Pedido */
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 14px}
.resumen div{background:var(--surface);padding:10px 12px;min-width:0}
.resumen b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.resumen span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.prov{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden}
.prov-cab{padding:12px 14px 8px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line)}
.prov-cab h2{font-family:var(--display);font-size:21px;margin:0}
.prov-cab .info{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px}
.prov-cab .info a{color:inherit}
.lin{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.lin .n{min-width:0}
.lin .n b{font-weight:600}
.lin .n small{display:block;color:var(--muted);font-size:12px}
.lin input{width:64px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 6px;text-align:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.lin .eur{width:64px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.lin.cero{opacity:.55}
.prov-pie{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 12px;align-items:center}
.prov-pie .total{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.anadir{padding:8px 14px;border-bottom:1px solid var(--line)}
.anadir select{width:100%;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px;font-size:15px;color:var(--muted)}
.aviso{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted);margin:10px 0}
.aviso a{color:var(--fg)}
.pdfbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 8px}
.vacio{text-align:center;color:var(--muted);padding:40px 10px}
.vacio b{display:block;font-family:var(--display);font-size:22px;color:var(--fg);margin-bottom:6px}

/* Precios */
.precio-lin{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.precio-lin small{color:var(--muted);font-size:13px;display:block}
.precio-lin .campo{display:flex;align-items:center;gap:4px}
.precio-lin input{width:86px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:right;font-size:17px;font-variant-numeric:tabular-nums}

/* Administración */
.segm{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin:16px 0 12px}
.segm button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:600;font-size:15px;color:var(--muted)}
.segm button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.cab-lista{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:6px 0 8px}
.cab-lista p{margin:0;color:var(--muted);font-size:14px}
.reg{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px}
.reg .t{flex:1;min-width:0}
.reg .t b{display:block;font-weight:600;font-size:17px}
.reg .t small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg .chev{color:var(--muted);font-size:20px}
.reg.inactivo{opacity:.5}
.pill.rol{background:var(--surface-2);color:var(--fg)}
.pill.admin{background:var(--brand);color:var(--brand-ink)}

/* Recepción */
.ped{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.ped .t{flex:1;min-width:0}
.ped .t b{display:block;font-family:var(--display);font-size:19px}
.ped .t small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.pill.parcial{background:var(--warn-bg);color:var(--warn)}
.pill.pend{background:var(--surface-2);color:var(--info)}
.volver-lista{background:none;border:0;color:var(--muted);padding:14px 0 0;font-size:15px}
.rec{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rec .nom{font-weight:600;font-size:17px;min-width:0}
.rec .meta{grid-column:1;color:var(--muted);font-size:13px}
.rec .falta{grid-column:2;grid-row:1;text-align:right;font-variant-numeric:tabular-nums}
.rec .falta b{display:block;font-family:var(--display);font-size:24px;line-height:1}
.rec .falta small{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.rec.listo .falta b{color:var(--ok)}
.rec .ctrl{grid-column:1 / -1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rec .ctrl .paso{grid-row:auto;grid-column:auto}
.btn.todo{padding:10px 14px;font-size:15px;box-shadow:none;background:var(--surface-2);color:var(--fg)}
.rec.listo .btn.todo{background:var(--ok-bg);color:var(--ok)}
.barra-doble{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* Caja */
.mesnav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.mesnav b{font-family:var(--display);font-size:22px;text-transform:capitalize}
.mesnav button{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:4px 0}
.cal button{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:54px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;font-variant-numeric:tabular-nums;min-width:0}
.cal button .n{font-weight:600;font-size:15px}
.cal button .v{font-size:10.5px;color:var(--ok);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cal button.hoy{border-color:var(--brand);border-width:2px}
.cal button.sel{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.cal button.sel .v{color:var(--brand-ink)}
.cal button.fuera{visibility:hidden}
.dia{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
.dia h2{font-family:var(--display);font-size:20px;margin:0 0 10px}
.dia .campos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dia label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted);min-width:0}
.dia input,.dia textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:20px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;width:100%;min-width:0;color:var(--fg)}
.dia textarea{font-size:15px;font-weight:400;text-align:left;min-height:44px}
.dia .total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--brand);margin-top:12px;padding-top:10px}
.dia .total span{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.dia .total b{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 14px}
.res div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.res span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.res b{display:block;font-family:var(--display);font-size:21px;font-variant-numeric:tabular-nums;margin:2px 0}
.res small{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabla-wrap{overflow-x:auto}
table.anio{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
table.anio th{text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
table.anio th:first-child,table.anio td:first-child{text-align:left;text-transform:capitalize}
table.anio td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line)}
table.anio tr.tot td{font-weight:700;border-top:2px solid var(--brand)}
h3.sec{font-family:var(--display);font-size:19px;margin:18px 0 6px}

/* Hoja modal */
.velo{position:fixed;inset:0;background:rgba(20,16,16,.7);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.hoja{background:var(--surface);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:22px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px))}
.hoja h3{font-family:var(--display);font-size:24px;margin:0 0 4px}
.hoja > p{margin:0 0 14px;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .ancho{grid-column:1 / -1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em;min-width:0}
.form input,.form select,.form textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:16px;font-weight:400;color:var(--fg);width:100%;min-width:0}
.form textarea{min-height:64px;resize:vertical}
.form .sep{grid-column:1 / -1;font-family:var(--display);font-size:17px;color:var(--fg);border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:6px}
.interruptor{flex-direction:row !important;align-items:center;gap:10px !important;color:var(--fg) !important;font-size:16px !important;font-weight:500 !important}
.interruptor input{width:22px;height:22px}
.botones{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.form-error{color:var(--warn);font-weight:600;margin:10px 0 0;min-height:1em}
@media (max-width:420px){ .form{grid-template-columns:1fr} }

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.cargando{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--beige);background:var(--negro);font-size:15px;letter-spacing:.12em;text-transform:uppercase}
</style>

/* ===================== Servidor ===================== */
// Dentro de Google se usa google.script.run. Si la pantalla está alojada en otra web,
// se llama al mismo script por POST sin la sesión de Google (API_URL).
const API_URL = '__API_URL__';
function llamar(fn, ...args){
  if (window.google && google.script && google.script.run){
    return new Promise((res, rej) => {
      google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e && e.message ? e : new Error(String(e))))[fn](...args);
    });
  }
  return fetch(API_URL, { method: 'POST', credentials: 'omit', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) })
    .then(r => { if (!r.ok) throw new Error('No se pudo conectar'); return r.json(); })
    .then(j => { if (!j.ok) throw new Error(j.error); return j.r; });
}
/* Llamada con usuario y PIN; si la sesión no vale, vuelve a la pantalla de entrada */
async function server(fn, ...args){
  try { return await llamar(fn, S.cred, ...args); }
  catch(e){
    if (String(e.message).includes('SESION:')){ salir(e.message.replace(/^.*SESION:\s*/, '')); throw new Error('Sesión caducada'); }
    throw new Error(String(e.message).replace(/^Error:\s*/, '').replace(/^Exception:\s*/, ''));
  }
}

function salir(msg){
  S.cred = null; S.usuario = null; S.datos = null; S.borrador = {}; S.cantidades = {}; S.recep = null;

/* ===================== Utilidades ===================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === '' || v === null || v === undefined || isNaN(Number(String(v).replace(',','.')))) ? '' : Number(String(v).replace(',','.'));
const eur = n => n === '' || n === null || n === undefined ? '' : n.toLocaleString('es-ES', {style:'currency', currency:'EUR'});
const fmtN = n => n === '' ? '' : (Math.round(n*100)/100).toLocaleString('es-ES');
const sinAcentos = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function hace(iso){
  if (!iso) return '';
  const d = new Date(iso), dias = Math.floor((Date.now() - d) / 864e5);
  if (dias <= 0) return 'hoy ' + d.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
  if (dias === 1) return 'ayer';
  if (dias < 7) return 'hace ' + dias + ' días';
  return d.toLocaleDateString('es-ES', {day:'numeric', month:'short'});
}
const fecha = iso => iso ? new Date(iso).toLocaleDateString('es-ES', {day:'numeric', month:'short'}) : '';
function toast(t){
  const el = document.getElementById('toast'); el.textContent = t; el.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => el.hidden = true, 2600);
}
const productosActivos = () => S.datos.productos.filter(p => p.activo !== false && provActivo(p.proveedor));
const provActivo = n => { const p = S.datos.proveedores.find(x => x.nombre === n); return !p || p.activo !== false; };
const provPorNombre = n => S.datos.proveedores.find(p => p.nombre === n) || { nombre: n };
const alfa = (a, b) => String(a || '').localeCompare(String(b || ''), 'es', { sensitivity: 'base', numeric: true });
/* Proveedores y productos siempre por orden alfabético (se aplica a cada dato nuevo que llega del servidor) */
function ordenarDatos(d){
  if (!d || d._ordenado) return;
  (d.proveedores || []).sort((a, b) => alfa(a.nombre, b.nombre));
  (d.productos || []).sort((a, b) => alfa(a.nombre, b.nombre));
  (d.pedidos || []).forEach(p => (p.lineas || []).sort((a, b) => alfa(a.producto, b.producto)));
  Object.defineProperty(d, '_ordenado', { value: true });
}
function grupos(lista){
  const m = new Map();
  lista.forEach(p => { if (!m.has(p.proveedor)) m.set(p.proveedor, []); m.get(p.proveedor).push(p); });
  m.forEach(ps => ps.sort((a, b) => alfa(a.nombre, b.nombre)));
  return [...m.entries()].sort((a, b) => alfa(a[0], b[0]));
}
function opciones(lista, actual, vacio){
  const l = actual && !lista.includes(actual) ? [actual, ...lista] : lista;
  return (vacio !== undefined ? `<option value="">${esc(vacio)}</option>` : '') + l.map(v => `<option value="${esc(v)}" ${v === actual ? 'selected' : ''}>${esc(v)}</option>`).join('');
}

/* Lógica de stock */
function actualDe(p){ const b = S.borrador[p.id]; return (b && b.actual !== undefined && b.actual !== '') ? num(b.actual) : p.actual; }
function sugerido(p){
  const a = actualDe(p);
  if (a === '' || p.minimo === '' || p.ideal === '') return '';
  return a <= p.minimo ? Math.max(p.ideal - a, 0) : 0;
}
function manualDe(p){ const b = S.borrador[p.id]; return (b && 'aPedir' in b) ? num(b.aPedir) : p.aPedir; }
function aPedir(p){
  if (p.id in S.cantidades) return num(S.cantidades[p.id]) || 0;
  const m = manualDe(p); if (m !== '') return m;
  return sugerido(p) || 0;
}
const yaPedido = p => p.ultimoPedido && (!p.ultimaCuenta || new Date(p.ultimoPedido) >= new Date(p.ultimaCuenta)) && !S.borrador[p.id];
const tienePrecio = p => p.precio !== '' && p.precio !== undefined && p.precio !== null;

/* ===================== Render principal ===================== */
function render(){
  const app = document.getElementById('app');
  ordenarDatos(S.datos);
  setTimeout(mirarArriba, 0);
  if (S.pantalla === 'entrar') return vistaEntrar(app);
  if (S.pantalla === 'inicio') return vistaInicio(app);
  if (!S.datos) return;
  const sec = SECCIONES[S.pantalla];
  if (!sec || (sec.admin && !esAdmin())){ S.pantalla = 'inicio'; return render(); }
  if (!document.getElementById('vista')){
    app.innerHTML = `<header class="top"><div class="wrap">
        <button class="volver" type="button" data-ir="inicio" aria-label="Volver al inicio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg><img alt="" src="${LOGO}"></button>
        <div class="titulo" id="titulo"></div>
        <span class="sync" id="sync"></span>
        <button class="quien" id="btnQuien" type="button"></button>
      </div></header>
      <main class="wrap" id="vista"></main>
      <div class="accion" id="accion" hidden><div class="wrap" id="accionWrap"></div></div>`;
  }
  document.getElementById('titulo').textContent = sec.titulo;
  document.getElementById('btnQuien').textContent = S.usuario.nombre;
  ({almacen: vistaAlmacen, recepcion: vistaRecepcion, pedido: vistaPedido, precios: vistaPrecios, caja: vistaCaja, admin: vistaAdmin})[S.pantalla]();
}
function ir(p){ S.pantalla = p; S.confirmar = ''; S.recep = null; S.recepConfirmar = false; S.filtro = { q: '', prov: '', modo: 'todos' }; document.getElementById('app').innerHTML = ''; window.scrollTo(0, 0); render(); }

/* ---------- ENTRAR ---------- */
// Solo PIN: el PIN dice quién eres. 4 cifras los básicos (botón Entrar), 6 los administradores (entra solo).
const PIN_MAX = 6;
function vistaEntrar(app){
  const L = S.login;
  const n = L.pin.length;
  app.innerHTML = `<section class="portada"><div class="wrap">
      <p class="saludo">Hola<small>Escribe tu PIN</small></p>
      <div class="puntos ${L.error ? 'agita' : ''}" aria-label="${n} números escritos">${Array.from({length: PIN_MAX}, (_, i) => `<i class="${i < n ? 'on' : i >= 4 ? 'hueco' : ''}"></i>`).join('')}</div>
      <p class="error" role="alert">${esc(L.error)}</p>
      <div class="teclado">${[1,2,3,4,5,6,7,8,9].map(d => `<button type="button" data-tecla="${d}">${d}</button>`).join('')}
        <button type="button" data-tecla="borrar" aria-label="Borrar">⌫</button><button type="button" data-tecla="0">0</button><button type="button" data-tecla="ok" class="tecla-ok" ${n < 4 ? 'disabled' : ''}>Entrar</button></div>
      ${L.enviando ? '<p class="muted" style="text-align:center;margin-top:12px">Entrando…</p>' : ''}
  </div></section>`;
}
async function tecla(t){
  const L = S.login;
  if (L.enviando) return;
  if (t === 'borrar'){ L.pin = L.pin.slice(0, -1); L.error = ''; return render(); }
  if (t !== 'ok'){
    if (L.pin.length >= PIN_MAX) return;
    L.pin += t; L.error = ''; render();
    if (L.pin.length < PIN_MAX) return;     // con 6 cifras entra solo
  }
  if (L.pin.length < 4) return;
  const pin = L.pin;
  L.enviando = true; render();
  try {
    const r = await llamar('entrar', { pin });
    L.enviando = false;
    S.cred = { nombre: r.usuario.nombre, pin };
    S.usuario = r.usuario; S.datos = r.datos; S.borrador = ls.get(claveBorrador(), {}); S.pantalla = 'inicio'; render();
  } catch(e){
    L.enviando = false;
    const m = String(e.message);
    L.pin = ''; L.error = m.includes('SESION:') ? m.replace(/^.*SESION:\s*/, '') : 'No se pudo conectar'; render();
  }
}

/* ---------- Filtros comunes ---------- */
function filtrosHTML(conModos, conInactivos){
  const provs = S.datos.proveedores.filter(p => conInactivos || p.activo !== false).map(p => `<option value="${esc(p.nombre)}" ${S.filtro.prov === p.nombre ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('');
  const modos = conModos ? [['todos','Todo'],['pedir','Por pedir'],['sincontar','Sin contar esta semana']]
    .map(([k, t]) => `<button type="button" class="chip" data-modo="${k}" aria-pressed="${S.filtro.modo === k}">${t}</button>`).join('') : '';
  return `<div class="filtros">
    <input class="buscar" id="q" type="search" placeholder="Buscar producto…" value="${esc(S.filtro.q)}" autocomplete="off">
    <div class="fila-filtros"><select class="sel" id="fprov" aria-label="Proveedor"><option value="">Todos los proveedores</option>${provs}</select>${modos}</div>
  </div>`;
}
function filtrar(lista){
  const q = sinAcentos(S.filtro.q.trim());
  return lista.filter(p => {
    if (S.filtro.prov && p.proveedor !== S.filtro.prov) return false;
    if (q && !sinAcentos(p.nombre + ' ' + p.proveedor).includes(q)) return false;
    if (S.pantalla === 'almacen' && S.filtro.modo === 'pedir' && !(aPedir(p) > 0)) return false;
    if (S.pantalla === 'almacen' && S.filtro.modo === 'sincontar' && p.ultimaCuenta && (Date.now() - new Date(p.ultimaCuenta)) < 7*864e5) return false;
    return true;
  });
}

/* ---------- ALMACÉN ---------- */
function estadoHTML(p){
  if (yaPedido(p)) return `<span class="pill pedido">Pedido ${fecha(p.ultimoPedido)}</span>`;
  const n = aPedir(p);
  if (n > 0) return `<span class="pill pedir">Pedir ${fmtN(n)}</span>`;
  if (p.minimo === '' || p.ideal === '') return manualDe(p) === '' ? `<span class="pill nada">Sin mínimo</span>` : '';
  if (actualDe(p) === '') return `<span class="pill nada">Sin contar</span>`;
  return `<span class="pill ok">Bien</span>`;
}
function filaAlmacen(p){
  const b = S.borrador[p.id] || {};
  const val = b.actual !== undefined ? b.actual : '';
  const ph = p.actual !== '' ? fmtN(p.actual) : '–';
  const quien = p.ultimaCuenta ? `${hace(p.ultimaCuenta)}${p.contadoPor ? ' · ' + esc(p.contadoPor) : ''}` : 'nunca contado';
  const abierto = S.abierto === p.id;
  return `<div class="prod ${S.borrador[p.id] ? 'cambiado' : ''}" data-id="${esc(p.id)}">
    <div class="nom">${esc(p.nombre)}</div>
    <div class="paso">
      <button type="button" data-paso="-1" aria-label="Uno menos">−</button>
      <input type="text" inputmode="decimal" value="${esc(val)}" placeholder="${ph}" aria-label="Cantidad de ${esc(p.nombre)}" data-campo="actual">
      <button type="button" data-paso="1" aria-label="Uno más">+</button>
    </div>
    <div class="meta">${p.unidad ? esc(p.unidad) + ' ·' : ''} ${quien} ${estadoHTML(p)} <button type="button" class="linkbtn" data-abrir>${abierto ? 'cerrar' : 'más'}</button></div>
    ${abierto ? `<div class="mas">
      <label>Pedir a mano <input type="text" inputmode="decimal" data-campo="aPedir" value="${esc(manualDe(p))}" placeholder="${esc(sugerido(p) === '' ? '' : sugerido(p))}"></label>
      <span>Mín. ${p.minimo === '' ? '–' : fmtN(p.minimo)} · Ideal ${p.ideal === '' ? '–' : fmtN(p.ideal)}</span>
      ${p.notas ? `<span>${esc(p.notas)}</span>` : ''}
    </div>` : ''}
  </div>`;
}
function barraAlmacen(){
  const pend = Object.keys(S.borrador).length;
  barraAccion(pend ? `<button class="btn" id="btnGuardar" type="button" ${S.guardando ? 'disabled' : ''}>${S.guardando ? 'Guardando…' : `Guardar recuento (${pend})`}</button>` : '');
}
function vistaAlmacen(){
  const gs = grupos(filtrar(productosActivos()));
  document.getElementById('vista').innerHTML = `
    <h1>Recuento de almacén</h1>
    <p class="sub">Apunta cuánto queda de cada cosa. Si no lo has contado, déjalo vacío.</p>

      return `<section class="grupo"><div class="grupo-cab"><h2>${esc(prov)}</h2><span>${np ? np + ' por pedir · ' : ''}${ps.length} productos</span></div>${ps.map(filaAlmacen).join('')}</section>`; }).join('')
      : `<div class="vacio"><b>Nada por aquí</b>Prueba con otro filtro o búsqueda.</div>`}`;

  enlazarFiltros();
}

/* ---------- PEDIDO ---------- */
function totalLinea(p){ const n = aPedir(p); return (tienePrecio(p) && n) ? p.precio * n : 0; }
function vistaPedido(){
  const activos = productosActivos();
  const gs = grupos(filtrar(activos).filter(p => aPedir(p) > 0 || S.extra[p.id] || S.verTodo));
  const lineas = activos.filter(p => aPedir(p) > 0);
  const total = lineas.reduce((s, p) => s + totalLinea(p), 0);
  const nProv = new Set(lineas.map(p => p.proveedor)).size;
  const hoy = new Date();
  const dom = new Date(hoy); dom.setDate(hoy.getDate() + ((7 - hoy.getDay()) % 7));
  document.getElementById('vista').innerHTML = `
    <h1>Lista de la compra</h1>
    <p class="sub">Para el domingo ${dom.toLocaleDateString('es-ES', {day:'numeric', month:'long'})}. Revisa cantidades, genera el PDF y envía cada pedido.</p>

      <div><b>${nProv}</b><span>Proveedores</span></div>
      <div><b>${lineas.length}</b><span>Productos</span></div>
      <div><b>${total ? Math.round(total).toLocaleString('es-ES') + ' €' : '–'}</b><span>Estimado</span></div>
    </div>
    <div class="pdfbar">
      <button class="btn peq" type="button" id="btnPdf">Generar PDF editable</button>

    ${gs.length ? gs.map(([prov, ps]) => tarjetaProveedor(prov, ps)).join('')
      : `<div class="vacio"><b>No hay nada que pedir</b>Cuando el equipo cuente el almacén, aquí saldrá lo que falta. También puedes activar «Ver también lo que no hace falta pedir».</div>`}`;
  const pend = Object.keys(S.cantidades).length;
  barraAccion(pend ? `<button class="btn" type="button" id="btnGuardarCant" ${S.guardando ? 'disabled' : ''}>${S.guardando ? 'Guardando…' : `Guardar cantidades (${pend})`}</button>` : '');
  enlazarFiltros();
}
function tarjetaProveedor(prov, ps){
  const P = provPorNombre(prov);
  const otros = productosActivos().filter(p => p.proveedor === prov && !ps.includes(p));
  const lineas = ps.filter(p => aPedir(p) > 0);
  const total = lineas.reduce((s, p) => s + totalLinea(p), 0);
  const msg = mensajePedido(P, lineas);
  const info = [
    P.canal && esc('Se pide por ' + P.canal.toLowerCase()),
    P.diaPedido && esc('Pedir: ' + P.diaPedido), P.diaReparto && esc('Reparto: ' + P.diaReparto),
    P.telefono && `<a href="tel:${esc(P.telefono.replace(/\s/g, ''))}">Tel. ${esc(P.telefono)}</a>`,
    P.email && esc(P.email), P.direccion && esc(P.direccion),
    P.pedidoMinimo !== '' && P.pedidoMinimo !== undefined && esc('Mínimo ' + eur(P.pedidoMinimo))].filter(Boolean);
  const bajoMinimo = P.pedidoMinimo && total && total < P.pedidoMinimo;
  const wa = P.whatsapp ? `https://wa.me/${P.whatsapp}?text=${encodeURIComponent(msg)}` : '';
  const cfg = S.datos.config || {};
  const asunto = (cfg.ASUNTO_EMAIL || 'Pedido El Otro Lado - {fecha}').replace('{fecha}', new Date().toLocaleDateString('es-ES'));
  const mail = P.email ? `mailto:${P.email}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(msg)}` : '';
  const conf = S.confirmar === prov;
  return `<section class="prov" data-prov="${esc(prov)}">
    <div class="prov-cab"><h2>${esc(prov)}</h2>${info.length ? `<div class="info">${info.map(i => `<span>${i}</span>`).join('')}</div>` : ''}</div>
    ${ps.map(p => {
      const n = aPedir(p);
      const sub = [p.unidad, actualDe(p) !== '' ? 'quedan ' + fmtN(actualDe(p)) : '', yaPedido(p) ? 'pedido el ' + fecha(p.ultimoPedido) : ''].filter(Boolean).join(' · ');
      return `<div class="lin ${n ? '' : 'cero'}" data-id="${esc(p.id)}">
        <div class="n"><b>${esc(p.nombre)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>
        <input type="text" inputmode="decimal" value="${n ? fmtN(n) : ''}" placeholder="0" aria-label="Cantidad a pedir de ${esc(p.nombre)}" data-cant>
        <span class="eur">${tienePrecio(p) && n ? eur(p.precio * n) : (tienePrecio(p) ? eur(p.precio) : '')}</span>
      </div>`; }).join('')}
    ${otros.length ? `<div class="anadir"><select data-anadir aria-label="Añadir producto de ${esc(prov)}"><option value="">+ Añadir otro producto de ${esc(prov)}</option>${otros.map(o => `<option value="${esc(o.id)}">${esc(o.nombre)}</option>`).join('')}</select></div>` : ''}
    ${bajoMinimo ? `<div class="aviso" style="margin:10px 14px 0">No llega al pedido mínimo de ${eur(P.pedidoMinimo)}.</div>` : ''}
    <div class="prov-pie">
      ${lineas.length ? `
        ${wa ? `<a class="btn peq" href="${wa}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
        ${mail ? `<a class="btn peq sec" href="${mail}" target="_blank" rel="noopener">Email</a>` : ''}
        <button type="button" class="btn peq sec" data-copiar>Copiar pedido</button>
        ${conf ? `<button type="button" class="btn peq" data-hecho="si">Sí, ya está pedido</button><button type="button" class="btn peq sec" data-hecho="no">No</button>`
               : `<button type="button" class="btn peq sec" data-hecho="preguntar">Marcar como pedido</button>`}
      ` : `<span class="sub" style="margin:0">Nada que pedir</span>`}
      ${total ? `<span class="total">${eur(total)}</span>` : ''}
    </div>
  </section>`;
}
function mensajePedido(P, lineas){
  const cfg = S.datos.config || {};
  const plantilla = String(cfg.MENSAJE_PEDIDO || 'Hola{contacto}, somos El Otro Lado. Os pasamos el pedido:\n{lineas}\n¡Gracias!').replace(/\\n/g, '\n');
  const ls = lineas.map(p => `- ${fmtN(aPedir(p))}${p.unidad ? ' ' + p.unidad : ''} ${p.nombre}`).join('\n');
  return plantilla.replace('{contacto}', P.contacto ? ' ' + P.contacto : '').replace('{lineas}', ls).replace('{fecha}', new Date().toLocaleDateString('es-ES'));
}

        ${ps.map(p => `<button type="button" class="reg ${p.activo === false ? 'inactivo' : ''}" data-editar-producto="${esc(p.id)}">
          <span class="t"><b>${esc(p.nombre)}</b><small>${[p.categoria, p.unidad, (p.minimo !== '' || p.ideal !== '') ? `mín. ${p.minimo === '' ? '–' : fmtN(p.minimo)} / ideal ${p.ideal === '' ? '–' : fmtN(p.ideal)}` : 'sin mínimo', tienePrecio(p) ? eur(p.precio) : ''].filter(Boolean).map(esc).join(' · ')}</small></span>
          ${p.activo === false ? '<span class="pill nada">Inactivo</span>' : ''}<span class="chev">›</span></button>`).join('')}</section>`).join('')}`;
  }
  document.getElementById('vista').innerHTML = `
    <h1>Administración</h1>
    <div class="segm" role="group" aria-label="Qué gestionar">${[['usuarios','Usuarios'],['productos','Productos'],['proveedores','Proveedores']].map(([k, l]) =>
      `<button type="button" data-admintab="${k}" aria-pressed="${t === k}">${l}</button>`).join('')}</div>
    ${cuerpo}`;
  barraAccion('');
  enlazarFiltros();
}

/* Formularios en hoja modal */
function abrirHoja(html){ document.getElementById('modal').innerHTML = `<div class="velo"><div class="hoja" role="dialog" aria-modal="true">${html}</div></div>`; }
function cerrarHoja(){ document.getElementById('modal').innerHTML = ''; }
const casilla = (id, txt, on) => `<label class="interruptor ancho"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}> ${txt}</label>`;
const botonesForm = conBorrar => `<p class="form-error" id="ferr" role="alert"></p><div class="botones">${conBorrar ? '<button class="btn peligro peq" type="button" id="bBorrar" style="margin-right:auto">Eliminar</button>' : ''}<button class="btn sec peq" type="button" data-cerrar>Cancelar</button><button class="btn peq" type="submit">Guardar</button></div>`;
/* Confirmación antes de eliminar algo para siempre */
function confirmarBorrado(titulo, texto, fn){
  abrirHoja(`<h3>${titulo}</h3><p>${texto}</p><p class="form-error" id="ferr" role="alert"></p>
    <div class="botones"><button class="btn sec peq" type="button" data-cerrar>Cancelar</button><button class="btn peligro peq" type="button" id="bSiBorrar">Sí, eliminar</button></div>`);

}

/* ---------- RECEPCIÓN ---------- */
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function deYmd(t){ const [a, m, d] = t.split('-').map(Number); return new Date(a, m - 1, d); }
const pendLinea = l => Math.max((l.cantidad || 0) - (l.recibido || 0), 0);
function vistaRecepcion(){
  const peds = S.datos.pedidos || [];
  const p = S.recep && peds.find(x => x.num === S.recep.num);
  if (S.recep && !p) S.recep = null;
  if (!p){
    document.getElementById('vista').innerHTML = `
      <h1>Recepción de pedidos</h1>
      <p class="sub">Cuando llegue un proveedor, abre su pedido y marca lo que trae. Lo recibido se suma solo al almacén.</p>
      ${peds.length ? peds.map(x => {
        const falta = x.lineas.reduce((s, l) => s + pendLinea(l), 0);
        const prods = x.lineas.filter(l => pendLinea(l) > 0).length;
        return `<button type="button" class="ped" data-recep="${esc(x.num)}">
          <span class="t"><b>${esc(x.proveedor)}</b><small>Pedido el ${fecha(x.fecha)}${x.hechoPor ? ' por ' + esc(x.hechoPor) : ''} · ${prods} ${prods === 1 ? 'producto' : 'productos'} por recibir (${fmtN(falta)} uds)</small></span>
          <span class="pill ${x.estado === 'Parcial' ? 'parcial' : 'pend'}">${x.estado === 'Parcial' ? 'Parcial' : 'Pendiente'}</span><span class="chev">›</span></button>`; }).join('')
      : `<div class="vacio"><b>No hay pedidos por recibir</b>Los pedidos aparecen aquí cuando en Pedido se marcan como «pedido».</div>`}`;
    barraAccion('');
    return;
  }
  const ahora = S.recep.ahora;
  const lineas = p.lineas.map(l => ({ ...l, ya: num(ahora[l.id]) || 0 }));
  const quedan = lineas.reduce((s, l) => s + Math.max(pendLinea(l) - l.ya, 0), 0);
  const marcado = lineas.reduce((s, l) => s + l.ya, 0);
  document.getElementById('vista').innerHTML = `
    <button type="button" class="volver-lista" data-recep-lista>‹ Todos los pedidos</button>
    <h1>${esc(p.proveedor)}</h1>
    <p class="sub">Pedido del ${fecha(p.fecha)}${p.hechoPor ? ' (' + esc(p.hechoPor) + ')' : ''}${p.estado === 'Parcial' ? ' · ya recibido en parte' : ''}. Pulsa + por cada unidad que llega o «Todo» si ha llegado completo.</p>
    ${lineas.map(l => {
      const pend = pendLinea(l);
      const falta = Math.max(pend - l.ya, 0);
      return `<div class="rec ${falta === 0 ? 'listo' : ''}" data-id="${esc(l.id)}">
        <div class="nom">${esc(l.producto)}</div>
        <div class="falta"><b>${falta === 0 ? '✓' : fmtN(falta)}</b><small>${falta === 0 ? 'completo' : 'faltan'}</small></div>
        <div class="meta">Pedido ${fmtN(l.cantidad)}${l.unidad ? ' ' + esc(l.unidad) : ''}${l.recibido ? ' · ya recibido ' + fmtN(l.recibido) : ''}</div>
        ${pend > 0 ? `<div class="ctrl">
          <div class="paso">
            <button type="button" data-rpaso="-1" aria-label="Uno menos">−</button>
            <input type="text" inputmode="decimal" value="${l.ya || ''}" placeholder="0" aria-label="Recibido ahora de ${esc(l.producto)}" data-rcant>
            <button type="button" data-rpaso="1" aria-label="Uno más">+</button>
          </div>
          <button type="button" class="btn todo" data-rtodo>${falta === 0 ? 'Llegó todo' : 'Todo (' + fmtN(pend) + ')'}</button>
        </div>` : ''}
      </div>`; }).join('')}
    ${esAdmin() ? `<div class="aviso" style="margin-top:18px">¿El proveedor no va a traer lo que falta?
      ${S.recepConfirmar ? `<div class="botones" style="justify-content:flex-start;margin-top:8px"><button type="button" class="btn peq peligro" data-rcerrar="si">Sí, cerrar el pedido con faltas</button><button type="button" class="btn peq sec" data-rcerrar="no">No</button></div>`
        : ` <button type="button" class="linkbtn" data-rcerrar="preguntar">Cerrar pedido con faltas</button>`}</div>` : ''}`;
  barraAccion(S.guardando ? `<button class="btn" type="button" disabled>Guardando…</button>`
    : quedan === 0 ? `<button class="btn" type="button" id="btnRecFin">Finalizar pedido</button>`
    : `<button class="btn" type="button" id="btnRecParcial" ${marcado ? '' : 'disabled'}>Recepción parcial${marcado ? ' (' + fmtN(marcado) + ' uds)' : ''}</button>`);
}
function tocarRecep(id, v){
  const p = (S.datos.pedidos || []).find(x => x.num === S.recep.num);
  const l = p && p.lineas.find(x => x.id === id);
  if (!l) return;
  const n = Math.max(0, num(v) || 0);
  if (n) S.recep.ahora[id] = n; else delete S.recep.ahora[id];
  render();
}
async function enviarRecepcion(cerrar){
  const p = (S.datos.pedidos || []).find(x => x.num === S.recep.num);
  const lineas = Object.entries(S.recep.ahora).map(([id, cantidad]) => ({ id, cantidad: num(cantidad) })).filter(l => l.cantidad > 0);
  const quedan = p.lineas.reduce((s, l) => s + Math.max(pendLinea(l) - (num(S.recep.ahora[l.id]) || 0), 0), 0);
  S.guardando = true; render(); setSync('Guardando…');
  try {
    S.datos = await server('recepcionarPedido', { num: p.num, lineas, cerrar: !!cerrar });
    toast(cerrar ? 'Pedido cerrado con faltas' : quedan === 0 ? 'Pedido completo. Sumado al almacén' : 'Recepción parcial guardada');
    S.recep = null; S.recepConfirmar = false;
  } catch(e){ toast('No se guardó: ' + e.message); }
  S.guardando = false; setSync(''); if (S.datos) render();
}

/* ---------- CAJA ---------- */
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function sumaCaja(desde, hasta){
  const r = { efectivo: 0, tarjeta: 0, total: 0, dias: 0 };
  (S.datos.caja || []).forEach(c => { if (c.fecha >= desde && c.fecha <= hasta){ r.efectivo += c.efectivo || 0; r.tarjeta += c.tarjeta || 0; r.total += c.total || 0; r.dias++; } });
  return r;
}
const eur0 = n => n.toLocaleString('es-ES', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
function vistaCaja(){
  const C = S.caja;
  const hoy = new Date();
  if (!C.sel) C.sel = ymd(hoy);
  const sel = deYmd(C.sel);
  if (!C.mes) C.mes = new Date(sel.getFullYear(), sel.getMonth(), 1);
  const mapa = {}; (S.datos.caja || []).forEach(c => mapa[c.fecha] = c);
  const y = C.mes.getFullYear(), m = C.mes.getMonth();
  const primero = (new Date(y, m, 1).getDay() + 6) % 7;
  const nDias = new Date(y, m + 1, 0).getDate();
  let celdas = '';
  for (let i = 0; i < primero; i++) celdas += '<button type="button" class="fuera" tabindex="-1" aria-hidden="true"></button>';
  for (let d = 1; d <= nDias; d++){
    const k = ymd(new Date(y, m, d)), c = mapa[k];
    celdas += `<button type="button" data-cdia="${k}" class="${k === ymd(hoy) ? 'hoy' : ''} ${k === C.sel ? 'sel' : ''}" aria-label="${d} de ${MESES[m]}${c ? ', ' + eur0(c.total) : ''}">
      <span class="n">${d}</span>${c ? `<span class="v">${Math.round(c.total).toLocaleString('es-ES')}</span>` : ''}</button>`;
  }
  const c = mapa[C.sel] || {};
  const f = C.form && C.form.fecha === C.sel ? C.form : { fecha: C.sel, efectivo: c.efectivo ?? '', tarjeta: c.tarjeta ?? '', notas: c.notas || '' };
  C.form = f;
  const tot = (num(f.efectivo) || 0) + (num(f.tarjeta) || 0);
  // Resúmenes del día seleccionado
  const lunes = new Date(sel); lunes.setDate(sel.getDate() - ((sel.getDay() + 6) % 7));
  const domingo = new Date(lunes); domingo.setDate(lunes.getDate() + 6);
  const sy = sel.getFullYear(), sm = sel.getMonth(), tq = Math.floor(sm / 3);
  const tiles = [
    ['Semana ' + lunes.getDate() + '–' + domingo.getDate() + ' ' + MESES[domingo.getMonth()].slice(0, 3), sumaCaja(ymd(lunes), ymd(domingo))],
    [MESES[sm] + ' ' + sy, sumaCaja(ymd(new Date(sy, sm, 1)), ymd(new Date(sy, sm + 1, 0)))],
    [(tq + 1) + 'º trimestre ' + sy, sumaCaja(ymd(new Date(sy, tq * 3, 1)), ymd(new Date(sy, tq * 3 + 3, 0)))],
    ['Año ' + sy, sumaCaja(sy + '-01-01', sy + '-12-31')]
  ];
  const filasAnio = MESES.map((nm, i) => [nm, sumaCaja(ymd(new Date(sy, i, 1)), ymd(new Date(sy, i + 1, 0)))]);
  const anio = tiles[3][1];
  const fechaLarga = sel.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('vista').innerHTML = `
    <h1>Control de caja</h1>
    <p class="sub">Elige un día, apunta el efectivo y la tarjeta y guarda. Los totales se calculan solos.</p>
    <div class="mesnav"><button type="button" data-cmes="-1" aria-label="Mes anterior">‹</button><b>${MESES[m]} ${y}</b><button type="button" data-cmes="1" aria-label="Mes siguiente">›</button></div>
    <div class="cal">${['L','M','X','J','V','S','D'].map(d => `<span class="dow">${d}</span>`).join('')}${celdas}</div>
    <form class="dia" id="fCaja">
      <h2>${esc(fechaLarga.charAt(0).toUpperCase() + fechaLarga.slice(1))}</h2>
      <div class="campos">
        <label>EFECTIVO<input id="caja_ef" inputmode="decimal" value="${f.efectivo === '' ? '' : typeof f.efectivo === 'number' ? f.efectivo.toFixed(2).replace('.', ',') : esc(f.efectivo)}" placeholder="0,00" autocomplete="off"></label>
        <label>TARJETA<input id="caja_ta" inputmode="decimal" value="${f.tarjeta === '' ? '' : typeof f.tarjeta === 'number' ? f.tarjeta.toFixed(2).replace('.', ',') : esc(f.tarjeta)}" placeholder="0,00" autocomplete="off"></label>
        <label style="grid-column:1/-1">NOTAS<textarea id="caja_notas" rows="1" placeholder="Opcional">${esc(f.notas)}</textarea></label>
      </div>
      <div class="total"><span>TOTAL DEL DÍA</span><b id="caja_tot">${eur0(tot)}</b></div>
      ${c.por ? `<p class="sub" style="margin:8px 0 0;font-size:13px">Apuntado por ${esc(c.por)}</p>` : ''}

async function guardarCaja(borrar){

  if (!borrar && payload.efectivo === '' && payload.tarjeta === ''){ toast('Escribe el efectivo o la tarjeta'); return; }

  catch(e){ toast('No se guardó: ' + e.message); }

}

function tocarBorrador(id, campo, valor){

/* ===================== Acciones ===================== */
async function guardarRecuento(){
  const items = Object.entries(S.borrador).map(([id, b]) => {
    const it = { id, actual: b.actual === undefined ? '' : num(b.actual) };
    if ('aPedir' in b) it.aPedir = num(b.aPedir);
    return it;
  });
  S.guardando = true; barraAlmacen(); setSync('Guardando…');
  try {
    S.datos = await server('guardarRecuento', {items});
    S.borrador = {}; guardarBorrador();
    toast(`Guardado: ${items.length} producto${items.length === 1 ? '' : 's'}`);
  } catch(e){ toast('No se pudo guardar. Revisa la conexión y vuelve a intentarlo.'); }
  S.guardando = false; setSync(''); if (S.datos) render();
}
async function guardarCantidades(silencioso){
  const items = Object.entries(S.cantidades).map(([id, v]) => ({id, aPedir: num(v)}));
  if (!items.length) return true;
  S.guardando = true; if (!silencioso) render(); setSync('Guardando…');
  try {
    S.datos = await server('guardarCantidades', {items});
    S.cantidades = {};
    if (!silencioso) toast('Cantidades guardadas');
    return true;
  } catch(e){ toast('No se pudo guardar: ' + e.message); return false; }
  finally { S.guardando = false; setSync(''); if (!silencioso && S.datos) render(); }
}
async function marcarHecho(prov){
  if (!(await guardarCantidades(true))) return;
  const P = provPorNombre(prov);
  const items = productosActivos().filter(p => p.proveedor === prov && aPedir(p) > 0).map(p => ({id: p.id, cantidad: aPedir(p)}));
  setSync('Guardando…');
  try {
    S.datos = await server('marcarPedidoHecho', {proveedor: prov, via: P.canal || '', items});
    toast(`Pedido a ${prov} apuntado`);
  } catch(e){ toast('No se pudo guardar: ' + e.message); }
  S.confirmar = ''; setSync(''); if (S.datos) render();
}

const WIN = /[^\x20-\x7E\xA0-\xFF€–—‘’“”•…]/g;
const limpio = s => String(s ?? '').replace(/≤/g, '<=').replace(/[\r\n]+/g, ' ').replace(WIN, '');
function corta(txt, font, size, ancho){
  txt = limpio(txt);
  if (font.widthOfTextAtSize(txt, size) <= ancho) return txt;
  while (txt.length > 1 && font.widthOfTextAtSize(txt + '…', size) > ancho) txt = txt.slice(0, -1);
  return txt + '…';
}
async function construirPdf(){
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.create();
  doc.setTitle('Lista de pedido - El Otro Lado'); doc.setAuthor(S.usuario.nombre);
  const helv = await doc.embedFont(StandardFonts.Helvetica);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const serif = await doc.embedFont(StandardFonts.TimesRomanBold);
  const logoBytes = Uint8Array.from(atob(LOGO.split(',')[1]), c => c.charCodeAt(0));
  const logo = LOGO.startsWith('data:image/png') ? await doc.embedPng(logoBytes) : await doc.embedJpg(logoBytes);
  const form = doc.getForm();
  const OSC = rgb(0.169, 0.145, 0.149), BEI = rgb(0.839, 0.737, 0.659), GRIS = rgb(0.45, 0.4, 0.38), LIN = rgb(0.85, 0.81, 0.78), CAMPO = rgb(1, 0.98, 0.93);
  const W = 595.28, H = 841.89, M = 36;
  const COL = { prod: M, ud: 300, stock: 360, cant: 405, precio: 462, nota: 505 };
  let page, y, nPag = 0;
  const hoy = new Date();
  const fechaLarga = hoy.toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  function nuevaPagina(){
    page = doc.addPage([W, H]); nPag++;
    if (nPag === 1){
      page.drawRectangle({x: 0, y: H - 110, width: W, height: 110, color: OSC});
      page.drawImage(logo, {x: M, y: H - 98, width: 86, height: 86});
      page.drawText('Lista de pedido', {x: M + 104, y: H - 52, size: 26, font: serif, color: BEI});
      page.drawText(limpio(fechaLarga.charAt(0).toUpperCase() + fechaLarga.slice(1)), {x: M + 104, y: H - 72, size: 11, font: helv, color: BEI});
      page.drawText(limpio('Preparada por: ' + S.usuario.nombre), {x: M + 104, y: H - 88, size: 9, font: helv, color: BEI});
      const tf = form.createTextField('notas_generales');
      tf.setText(''); tf.enableMultiline();
      page.drawText('Notas generales:', {x: 360, y: H - 30, size: 8, font: bold, color: BEI});
      tf.addToPage(page, {x: 360, y: H - 100, width: W - 360 - M, height: 64, font: helv, backgroundColor: rgb(0.23, 0.2, 0.2), borderColor: rgb(0.42, 0.35, 0.33), borderWidth: 0.5, textColor: BEI});
      tf.setFontSize(9);
      y = H - 132;
    } else {
      page.drawRectangle({x: 0, y: H - 34, width: W, height: 34, color: OSC});
      page.drawText('El Otro Lado · Lista de pedido', {x: M, y: H - 22, size: 11, font: serif, color: BEI});
      page.drawText(limpio(hoy.toLocaleDateString('es-ES')), {x: W - M - 60, y: H - 22, size: 9, font: helv, color: BEI});
      y = H - 56;
    }
  }
  function pie(){
    doc.getPages().forEach((p, i, a) => p.drawText(`Página ${i + 1} de ${a.length}  ·  Los campos en amarillo se pueden rellenar`, {x: M, y: 20, size: 7.5, font: helv, color: GRIS}));
  }
  function campo(nombre, texto, x, yy, w, h, centrado){
    const f = form.createTextField(nombre);
    f.setText(limpio(texto));
    f.addToPage(page, {x, y: yy, width: w, height: h, font: helv, backgroundColor: CAMPO, borderColor: LIN, borderWidth: 0.5});
    f.setFontSize(9);
    if (centrado) f.setAlignment(1);
    return f;
  }
  const activos = productosActivos();
  const lista = grupos(activos.filter(p => S.pdfTodos || aPedir(p) > 0 || S.extra[p.id]));
  if (!lista.length) throw new Error('No hay nada que pedir. Marca «Incluir todos los proveedores» para sacar la hoja completa.');
  nuevaPagina();
  let k = 0;
  for (const [prov, ps] of lista){
    const P = provPorNombre(prov);
    if (y - (38 + Math.min(ps.length, 3) * 17) < 50) nuevaPagina();
    page.drawRectangle({x: M, y: y - 18, width: W - 2*M, height: 20, color: BEI});
    page.drawText(corta(prov.toUpperCase(), bold, 10.5, 220), {x: M + 6, y: y - 12, size: 10.5, font: bold, color: OSC});
    const contacto = corta([P.telefono && 'Tel. ' + P.telefono, P.whatsapp && P.whatsapp !== String(P.telefono).replace(/\D/g, '') && 'WhatsApp ' + P.whatsapp, P.email, P.diaPedido && 'Pedir: ' + P.diaPedido].filter(Boolean).join('  ·  '), helv, 8, W - 2*M - 240);
    if (contacto) page.drawText(contacto, {x: W - M - 6 - helv.widthOfTextAtSize(contacto, 8), y: y - 12, size: 8, font: helv, color: OSC});
    y -= 32;
    [['Producto', COL.prod], ['Unidad', COL.ud], ['Quedan', COL.stock], ['Pedir', COL.cant], ['€/ud', COL.precio], ['Notas', COL.nota]]
      .forEach(([t, x]) => page.drawText(t, {x: x + 2, y, size: 7.5, font: bold, color: GRIS}));
    y -= 6;
    let total = 0;
    for (const p of ps){
      if (y - 17 < 46) nuevaPagina();
      y -= 17;
      const n = aPedir(p);
      page.drawText(corta(p.nombre, helv, 9.5, COL.ud - COL.prod - 8), {x: COL.prod + 2, y: y + 4, size: 9.5, font: helv, color: OSC});
      page.drawText(corta(p.unidad || '', helv, 8.5, COL.stock - COL.ud - 6), {x: COL.ud + 2, y: y + 4, size: 8.5, font: helv, color: GRIS});
      const a = actualDe(p);
      page.drawText(a === '' ? '' : fmtN(a), {x: COL.stock + 2, y: y + 4, size: 9, font: helv, color: GRIS});
      campo(`cant_${p.id}`, n ? fmtN(n) : '', COL.cant, y, 48, 14, true);
      if (tienePrecio(p)){ page.drawText(limpio(p.precio.toLocaleString('es-ES', {minimumFractionDigits: 2, maximumFractionDigits: 2})), {x: COL.precio + 2, y: y + 4, size: 8.5, font: helv, color: GRIS}); total += n ? p.precio * n : 0; }
      campo(`nota_${p.id}`, '', COL.nota, y, W - M - COL.nota, 14);
      page.drawLine({start: {x: M, y: y - 2}, end: {x: W - M, y: y - 2}, thickness: 0.4, color: LIN});
    }
    for (let i = 1; i <= 2; i++){
      if (y - 17 < 46) nuevaPagina();
      y -= 17;
      campo(`extra_${k}_${i}_producto`, '', COL.prod, y, COL.stock - COL.prod - 6, 14);
      campo(`extra_${k}_${i}_cant`, '', COL.cant, y, 48, 14, true);
      campo(`extra_${k}_${i}_nota`, '', COL.nota, y, W - M - COL.nota, 14);
    }
    if (total){ y -= 14; const t = limpio('Estimado: ' + eur(total)); page.drawText(t, {x: W - M - bold.widthOfTextAtSize(t, 9), y, size: 9, font: bold, color: OSC}); }
    y -= 20; k++;
  }
  form.updateFieldAppearances(helv);
  pie();
  return await doc.save();
}
function b64(bytes){
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(s);
}
async function generarPdf(){
  const res = document.getElementById('pdfRes');
  if (typeof PDFLib === 'undefined'){ res.innerHTML = '<div class="aviso">No se pudo cargar el generador de PDF. Revisa la conexión y recarga.</div>'; return; }
  res.innerHTML = '<div class="aviso">Generando PDF…</div>';
  try {
    await guardarCantidades(true);
    const bytes = await construirPdf();
    const d = new Date();
    const nombre = `Pedido El Otro Lado ${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.pdf`;
    const url = URL.createObjectURL(new Blob([bytes], {type: 'application/pdf'}));
    let drive = null;
    try { drive = await server('guardarPdf', b64(bytes), nombre); } catch(e){ drive = null; }
    res.innerHTML = `<div class="aviso">PDF listo. ${drive && drive.url ? `<a href="${drive.url}" target="_blank" rel="noopener">Abrir en Drive</a> · ` : ''}<a href="${url}" download="${esc(nombre)}">Descargar</a></div>`;
    S._ultimoPdf = bytes;
  } catch(e){ res.innerHTML = `<div class="aviso">${esc(e.message)}</div>`; }
}

function atras(){

  if (modal.innerHTML){ cerrarHoja(); return; }
  if (S.pantalla === 'recepcion' && S.recep){ S.recep = null; S.recepConfirmar = false; render(); return; }
  if (S.pantalla !== 'entrar' && S.pantalla !== 'inicio'){ ir('inicio'); return; }
  // en la pantalla de inicio o de entrada no hace nada
}
try {
  history.replaceState({ eol: 'base' }, '');
  history.pushState({ eol: 'app' }, '');
  window.addEventListener('popstate', () => { history.pushState({ eol: 'app' }, ''); atras(); });
} catch(e){}

window.addEventListener('beforeunload', e => { if (Object.keys(S.borrador).length){ e.preventDefault(); e.returnValue = ''; } });
arrancar();
</script>
